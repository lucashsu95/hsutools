name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync
      - name: Run tests
        run: uv run pytest
      - name: Build wheel and sdist
        run: uv build

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps with dev (for PyInstaller)
        run: uv sync
      - name: Build exe via Typer command
        run: uv run hsu build-exe
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsu-exe
          path: dist/**/*.exe
