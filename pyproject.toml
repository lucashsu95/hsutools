[project]
name = "hsutools"
version = "1.3.1"
description = "Utilities for directory readme generation, file management, renaming, docx to pdf conversion, and image to webp conversion."
authors = [{ name = "hsutools maintainers" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "typer>=0.12.5,<1.0",
    "click>=8.1.7,<8.2",
    "docx2pdf>=0.1.8,<1.0",
    "pillow>=10.0,<12.0",
    "opencc-python-reimplemented>=0.1.7,<1.0",
]

[project.optional-dependencies]
s2tw = ["opencc-python-reimplemented>=0.1.7,<1.0"]

[project.scripts]
hsu = "hsutools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsutools"]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9.0",
    "pyinstaller>=6.11.0,<7.0",
]
